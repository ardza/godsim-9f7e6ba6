<!doctype html>
<html lang="en" class="console"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Godsim (week 1)</title>
<style>
  /* Layout + base look. data/ui/theme.css (the Artist's kit: tokens, buttons, meters, tabs, motion) loads AFTER this block and wins on looks.
     Rules kept: all text >= 16px, tap targets >= 44px, the canvas map stays pixel art (render.js unchanged), system fonts only. */
  :root { --bg: #0f0c09; --panel: #2b2118; --panel-raised: rgba(255,244,225,.06); --line: rgba(241,230,207,.10); --text: #f1e6cf; --dim: #b9a585;
    --on: #8cbf55; --on-text: #14100b; --warn: #e05a6e; --info: #5b9bd8; --wheat: #e3c98f; --peek: 52px; --bar: 64px; --gap: 12px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { position: relative; display: flex; flex-direction: column; height: 100dvh; }
  svg { display: block; pointer-events: none; }
  button { cursor: pointer; touch-action: manipulation; font: inherit; font-size: 16px; color: var(--text); }
  button:disabled { opacity: .4; cursor: default; }

  /* top: floating rounded control groups (World menu, clock, 4 speeds) */
  #top { position: relative; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px var(--gap) 4px; }
  #top .grp { display: flex; gap: 4px; align-items: center; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  #top .grp button { background: transparent; border: 0; min-width: 44px; justify-content: center; padding: 0 12px; }
  #top .grp button.on { background: var(--on); color: var(--on-text); }
  #clock { display: block; line-height: 44px; min-height: 44px; padding: 0 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #speeds button { padding: 0 12px 0 10px; }
  #files { display: none; position: absolute; top: calc(100% + 4px); left: var(--gap); flex-wrap: wrap; gap: 8px; align-items: center; max-width: calc(100vw - 2 * var(--gap)); padding: 12px; }
  #top.menu-open #files { display: flex; }
  #seedshow { color: var(--dim); white-space: nowrap; }
  input { width: 8em; }
  input::placeholder { color: var(--dim); }

  /* map area: the stage takes everything between the top groups and the bottom tab bar */
  #main { flex: 1; position: relative; display: flex; flex-direction: column; min-height: 0; }
  #stage { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px; }
  #mapbox { position: relative; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.45); line-height: 0; }
  #cv { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; background: #000; border-radius: 8px; cursor: grab; }
  #cv.panning { cursor: grabbing; }
  #zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; padding: 4px; line-height: 1.2;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  #zoom button { width: 44px; height: 44px; padding: 0; justify-content: center; background: transparent; border: 0; }

  /* step 22: god powers bar (Rain / Warm / Cool), over the bottom-left of the map, just above the tab bar; 44px+ buttons, cooldown under the label */
  #powers { position: absolute; left: 8px; bottom: 8px; z-index: 5; display: flex; gap: 4px; padding: 4px; line-height: 1.2; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  #powers button { display: flex; align-items: center; gap: 6px; min-width: 44px; min-height: 48px; padding: 0 12px; font-size: 16px; background: transparent; border: 0; border-radius: 12px; }
  #powers button.on { background: var(--on); color: var(--on-text); }
  /* §40 / v37 item 8 (Artist's v37_ui mock, approved): Powers menu in labelled categories, 84x64 buttons with icon + 16px label, hint line at the bottom */
  #powers { flex-direction: column; gap: 6px; padding: 8px 10px; border-radius: 12px; max-width: min(calc(100% - 16px), 680px); box-sizing: border-box; }   /* 680: Weather + Healing on row 1, Creatures + Harm on row 2 (clear of the Log panel) */
  #powers .pw-cats { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  #powers .pw-cat h4 { margin: 0 0 4px; font-size: 16px; line-height: 20px; font-weight: 600; color: #b9a888; }
  #powers .pw-row { display: flex; flex-wrap: wrap; gap: 6px; }
  #powers button.pw { flex-direction: column; justify-content: center; gap: 4px; min-width: 84px; min-height: 64px; padding: 4px 8px; background: #4a3524; color: #f1e6cf; border-radius: 8px; }
  #powers button.pw.on { background: #8a5a2e; color: #f1e6cf; outline: 2px solid #4fc3d9; }
  #powers button.pw .cd:empty { display: none; }
  #powers .pw-hint { margin: 2px 0 0; font-size: 16px; line-height: 20px; color: #b9a888; }
  #powers button.cooling { color: var(--dim); }
  #powers button .cd { font-size: 16px; font-variant-numeric: tabular-nums; } #powers button .cd:empty { display: none; }
  #powers button svg { width: 24px; height: 24px; flex: 0 0 24px; }
  /* step 23: Lightning / Spawn join the bar; the Spawn picker (Grazer / Predator) sits just above it. Phones in portrait: icons only (names in the toast and aria-label) */
  #spawnpick { position: absolute; left: 8px; bottom: 250px; z-index: 6; display: flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  #spawnpick[hidden] { display: none; }
  #spawnpick button { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 96px; min-height: 48px; padding: 0 14px; font-size: 16px; background: transparent; border: 0; border-radius: 12px; }
  #spawnpick button svg { width: 24px; height: 24px; flex: 0 0 24px; }
  @media (max-width: 700px) { #powers button { padding: 0 10px; } #powers button:not(.pw) .lbl { display: none; } }
  /* v19 (Director + Artist): portrait phones under 700px: no floating bar. The Powers tab in the bottom bar slides up one 56px row of power icons
     just above the bar; picking a power closes it (the whole map is free to tap the spot); the tab is highlighted while a power waits for its spot.
     Closed = hidden (nothing over the map). Desktop and landscape unchanged: the tab is not shown there. */
  /* v39.1 (Commissioner): desktop / tablet / landscape too - Powers is a bottom-bar tab like on phones: closed by default (nothing over the map),
     the tab opens / closes the menu in its usual spot (bottom-left of the map); picking a power closes it, as on phones. */
  #panelbar #ptab-powers { display: flex; }
  @media (min-width: 701px), (orientation: landscape) { body:not(.pw-open) #powers { display: none; } body:not(.pw-open) #spawnpick { bottom: 8px; } }
  #panelbar #ptab-powers.armed { background: var(--on); color: var(--on-text); }
  @media (max-width: 700px) and (orientation: portrait) {
    #powers { position: fixed; left: 0; right: 0; bottom: var(--pbh, var(--bar)); z-index: 19; height: 56px; box-sizing: border-box; justify-content: space-around; align-items: center;
      border-radius: 16px 16px 0 0; border-bottom: 0; padding: 4px 8px; background: rgba(28,22,17,.97);
      transform: translateY(100%); visibility: hidden; transition: transform .2s cubic-bezier(.2,.8,.2,1), visibility 0s linear .2s; }
    body.pw-open #powers { transform: none; visibility: visible; transition: transform .2s cubic-bezier(.2,.8,.2,1), visibility 0s; }
    #powers button { flex: 1 1 0; justify-content: center; max-width: 88px; }
    #powers { height: auto; max-width: none; flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 8px 8px 6px; }   /* §40 categories: grows to fit */
    #powers button.pw { flex: 0 0 auto; max-width: none; min-width: 84px; }
    #spawnpick { position: fixed; left: 8px; right: 8px; bottom: calc(var(--pbh, var(--bar)) + 8px); z-index: 19; justify-content: center; }
  }
  #cv.aiming { cursor: crosshair; }
  /* §40 / v37: People sex dot (CSS only), Prayers Bless button (44px), person-card Health + body figure + injury list (Artist's v37_ui mock) */
  .pp-sex { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; flex: 0 0 10px; }
  .pr-row { display: flex; align-items: center; gap: 8px; min-height: 52px; } .pr-row .pr-text { flex: 1; min-width: 0; }
  .pr-bless { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 12px; font-size: 16px; background: #4a3524; color: #f1e6cf; border: 0; border-radius: 8px; flex: 0 0 auto; }
  .pr-bless svg { width: 20px; height: 20px; } .pr-blessed { font-size: 16px; color: #b9a888; flex: 0 0 auto; }
  .pp-health { margin: 4px 0 10px; } .pp-body { display: flex; gap: 14px; align-items: flex-start; margin-top: 8px; }
  .pp-figure { width: 64px; height: 128px; flex: 0 0 64px; }
  .pp-injuries { margin: 0; padding: 0; list-style: none; font-size: 16px; } .pp-injuries li { min-height: 22px; line-height: 22px; }
  .pp-injuries li.hurt { color: #e0a84f; } .pp-injuries li.bad { color: #e05a6e; } .pp-injuries .pp-ok { color: #b9a888; }
  /* panels: the person card and the open tab's panel (Log / Discoveries / Prayers) */
  #side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; }
  #side.bare { display: none; }
  #side .closed { display: none !important; }
  #sheet-handle { display: none; }
  #info { position: relative; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  #info .sec { margin-top: 12px; padding-top: 8px; } #info .row { margin-top: 4px; }
  #info h3 { margin: 0 52px 2px 0; } .sub { color: var(--dim); } .sub.hot { color: var(--warn); }
  #info-close { position: absolute; right: 12px; top: 12px; }
  .row { display: grid; grid-template-columns: 6.2em 1fr 4.4em; gap: 8px; align-items: center; margin-top: 6px; } .row b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row.need .bar { position: relative; } .row.need .bar em { position: absolute; left: 8px; top: 0; line-height: 22px; font-style: normal; font-size: 16px; color: var(--text); text-shadow: 0 1px 2px #000, 0 0 2px #000; white-space: nowrap; }
  .bar { height: 10px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--on); }
  .row.rel { display: flex; align-items: center; gap: 8px; min-height: 24px; } .row.rel span { flex: 1; } .row.rel em { font-style: normal; color: var(--dim); }
  .row.rel em.w-warm { color: var(--wheat); } .row.rel em.w-wary { color: var(--warn); }
  i.ring { display: inline-block; width: 12px; height: 8px; border: 3px solid; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--panel-raised); border: 1px solid var(--line); color: var(--wheat); }
  .exp-note { color: var(--dim); margin: 2px 0 0 calc(6.2em + 8px); }
  #info[hidden] { display: none !important; }
  .plog .empty { padding: 4px 0; }
  table.disc { width: 100%; border-collapse: collapse; font-size: 16px; } table.disc th { text-align: left; color: var(--wheat); font-weight: 650; padding: 4px; border-bottom: 1px solid var(--line); }
  .pfilt { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; } .pfilt button { min-height: 44px; min-width: 44px; padding: 0 12px; font-size: 16px; } .pfilt button.on { outline: 2px solid var(--wheat); }
  .prl { font-size: 16px; padding: 6px 0; border-bottom: 1px solid var(--line); } .prl time { color: var(--dim); margin-right: 8px; }
  table.disc td { padding: 4px; border-bottom: 1px solid var(--line); vertical-align: top; } table.disc .blank { color: var(--dim); }
  table.disc .disc-ico { display: inline-block; width: 20px; height: 20px; vertical-align: -4px; margin-right: 4px; color: var(--wheat); } table.disc .disc-ico svg { width: 20px; height: 20px; }
  .panel { min-height: 0; overflow-y: auto; }
  /* 26b People tab: All + group tabs (pill, ≥16px / ≥44px); oldest→youngest; collapsed Dead list */
  .peop-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0 8px; margin: 0 0 4px; border-bottom: 1px solid rgba(241,230,207,.10); }
  .peop-tab { flex: 0 0 auto; min-height: 44px; min-width: 44px; padding: 0 14px; font-size: 16px; border-radius: 999px; border: 0; background: transparent; color: var(--dim); cursor: pointer; }
  .peop-tab.on { background: var(--on); color: var(--on-text); font-weight: 600; }
  .plist { display: flex; flex-direction: column; gap: 4px; }
  .prow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; width: 100%; min-height: 44px; padding: 6px 10px; font-size: 16px; text-align: left; }
  .prow .pn { font-weight: 700; } .prow .pa { color: var(--dim); text-align: right; white-space: nowrap; }
  .prow .pm { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; } .prow .pm .bar { width: 44px; } .prow .pm b { font-variant-numeric: tabular-nums; min-width: 2ch; }
  .prow .pms { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; } .prow .pm.low b, .prow .pm.low .pl { color: #f0a0aa; }
  .pdead { margin-top: 10px; font-size: 16px; } .pdead summary { min-height: 44px; line-height: 44px; cursor: pointer; font-weight: 650; }
  .drow { display: grid; grid-template-columns: 1fr auto 1.4fr; gap: 8px; min-height: 44px; align-items: center; border-bottom: 1px solid var(--line); }
  #logwrap { min-height: 0; display: flex; flex-direction: column; }
  #tabs { flex-wrap: wrap; }
  #log { flex: 1; min-height: 0; overflow-y: auto; }
  .ev.warn { color: #f0a0aa; }
  .ev.birth { color: #a8e0a0; }
  .row.fam { grid-template-columns: 6.2em 1fr; align-items: center; } .lnks { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  button.lnk { min-height: 44px; min-width: 44px; padding: 0 12px; font-size: 16px; background: transparent; color: var(--wheat); border: 1px solid var(--line); border-radius: 8px; text-decoration: underline; cursor: pointer; }
  .lnk-gone, .dim { color: var(--dim); }
  /* v38 (e) two-person history "A & B" (inside the Kin / Log tab pane; 44px back button, 16px+ text) */
  .pp-pairhead { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; flex-wrap: wrap; }
  button.pp-back { min-height: 44px; min-width: 44px; padding: 0 12px; font-size: 16px; background: transparent; color: var(--wheat); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .pp-pairnames { font-size: 17px; }
  /* v19 (step 24) Find on a person's card: the kit's locate crosshair + "Find", next to the close button; and person names in the Log (tap = their card).
     A log name keeps the line's look; padding + negative margin give it a 44px tap area without making the line taller. */
  #info .findbtn { position: absolute; right: 64px; top: 12px; z-index: 1; min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 16px; }
  #info .findbtn svg { width: 24px; height: 24px; flex: 0 0 auto; }
  #info h3.hasfind { margin-right: 172px; }
  /* v25: person-card tabs Needs/Mind/Kin/Knows/Log — labels ≥16px, taps ≥44px; header+Find outside; Log in tab only */
  #info .pcard-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0 8px; margin: 8px 0 0; border-bottom: 1px solid rgba(241,230,207,.10); flex: 0 0 auto; }
  #info .pcard-tab { flex: 1; min-height: 44px; min-width: 44px; padding: 0 10px; font-size: 16px; border-radius: 999px; border: 0; background: transparent; color: var(--dim); cursor: pointer; }
  #info .pcard-tab.on { background: var(--on); color: var(--on-text); font-weight: 600; }

  #info .moods { display: flex; gap: 12px; flex-wrap: wrap; font-size: 16px; margin: 0 0 8px; }
  #info .moods span { font-variant-numeric: tabular-nums; }
  #info .moods .dom { font-weight: 700; color: var(--wheat); }
  #info .pcard-pane { flex: 1 1 auto; min-height: 0; padding-top: 8px; }
  #info .pcard-pane > .sec:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
  /* v36 §39: Artist people-ui / pp-* — fluid live layout (mock used fixed 260/440) */
  #info.people-ui { background: var(--pp-bg, #16110c); }
  #info.people-ui .pp-card { width: auto; max-width: none; border: 0; padding: 0; background: transparent; box-shadow: none; }
  #info.people-ui .pp-cardhead { padding-right: 52px; } /* room for #info-close */
  #info.people-ui .pp-pane { padding-top: 4px; }
  #panel-people.people-ui { background: var(--pp-bg, #16110c); }
  #panel-people.people-ui .pp-list { width: auto; max-width: none; border: 0; padding: 0; background: transparent; }
  #panel-people.people-ui .pp-rows { max-height: min(420px, 50vh); }
  button.logn { display: inline-block; font: inherit; color: inherit; background: none; border: 0; border-radius: 6px; padding: 12px 10px; margin: -12px -10px; min-height: 44px; min-width: 44px; text-align: center; text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 3px; cursor: pointer; }
  button.logn:hover, button.logn:focus-visible { text-decoration-color: currentColor; }
  .empty { color: var(--dim); padding: 6px 2px; }
  #hint { flex: 1 1 100%; color: var(--dim); max-width: 34em; }
  .touch-only { display: none; }
  #toast { position: fixed; z-index: 40; left: 50%; top: 72px; transform: translateX(-50%); background: var(--on); color: var(--on-text); font-weight: 600; opacity: 0; transition: opacity .3s; pointer-events: none; }

  /* bottom tab bar (all sizes): 56px tabs, icon over label (theme.css styles it) */
  #panelbar { flex: 0 0 auto; position: relative; z-index: 20; display: flex; justify-content: center; }
  #panelbar button { max-width: 128px; }
  #panelbar button svg { width: 24px; height: 24px; }

  /* Desktop / tablet: the card floats on the left, the open panel on the right, both over the map and above the bar */
  @media (min-width: 701px) and (min-height: 501px) {
    /* the top groups float over the map too, so the 3:2 map gets the full height above the bar */
    #top { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; } #top > * { pointer-events: auto; }
    #side { position: absolute; inset: 0; display: block; pointer-events: none; }
    #side > * { pointer-events: auto; }
    /* v39 (Judge): the card stops a gap above the Powers menu (--pw-h = its 2-row height 228px + its 8px bottom offset), so the menu no longer covers the card's last lines (Gear); the card scrolls instead */
    #info { --pw-h: 0px; position: absolute; left: var(--gap); top: 68px; width: 340px; max-height: calc(100% - 68px - 2 * var(--gap) - var(--pw-h)); overflow: hidden; }
    #info-body { flex: 1 1 auto; min-height: min(380px, 46vh, calc(100vh - 71px - 68px - 2 * var(--gap) - var(--pw-h) - 34px)); overflow-y: auto; }   /* 71px: the tab bar; 34px: the body's padding */   /* card details scroll; personal log is a tab pane */
    #logwrap { position: absolute; right: var(--gap); bottom: var(--gap); width: 380px; height: min(320px, calc(100% - 68px - var(--gap))); }
    /* v19: People joins them on the right (it sat across the top, over the card and its Find button) */
    #panel-discoveries, #panel-prayers, #panel-people { position: absolute; right: var(--gap); bottom: var(--gap); width: min(620px, calc(100% - 340px - 3 * var(--gap))); max-height: calc(100% - 68px - var(--gap)); }
    body.pw-open #info { --pw-h: 236px; }   /* v39.1: the gap is kept only while the Powers menu is open */
    #zoom { top: 60px; }
    #stage { padding: 0; }
  }
  /* Phones (portrait and landscape): Save/Load/New world stay in the World menu; season name dropped from the clock */
  @media (max-width: 700px), (max-height: 500px) {
    .wide { display: none; } .desk-only { display: none; } .touch-only { display: inline; }
    #hint { display: none; }
  }
  @media (max-width: 700px) and (orientation: portrait) {
    #top { padding: 8px 8px 4px; }
    #top .clockgrp { flex: 1; justify-content: center; }
    #speeds { width: 100%; } #speeds button { flex: 1; padding: 0 4px; }
    #stage { flex: 0 0 auto; }
    #side { flex: 1 1 0; display: flex; flex-direction: column; padding: 0 8px 8px; }
    #logwrap, .panel { flex: 1 1 0; }
    /* the person card slides up over the map, at most 58% of the screen, just above the tab bar */
    #info { position: fixed; z-index: 15; left: 8px; right: 8px; bottom: calc(var(--bar) + 8px + env(safe-area-inset-bottom)); max-height: 58dvh; }
    #info:not([hidden]) { animation: card-up .2s cubic-bezier(.2,.8,.2,1); }
    body.pw-open #info { display: none; }   /* v39.1: the Powers menu and the person card share the same spot: the open menu sets the card aside, closing it brings the card back */
    #info { overflow: hidden; } #info-body { flex: 1 1 auto; min-height: min(240px, 28dvh); overflow-y: auto; }
    body.log-off #stage { flex: 1 1 0; } body.log-off #side { flex: 0 0 0; padding: 0; }
  }
  @keyframes card-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (max-height: 500px) and (orientation: landscape) {
    #top { padding: 4px 8px; }
    #main { padding-bottom: var(--peek); } body.side-off #main { padding-bottom: 0; }
    /* sheet sits on top of the bottom tab bar */
    #side { position: fixed; left: 0; right: 0; bottom: var(--bar); z-index: 15; height: var(--peek); background: rgba(28,22,17,.96); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; }
    #side.open { height: calc(100dvh - 56px - var(--bar)); }
    #side:not(.open) > :not(#sheet-handle) { display: none !important; }
    #sheet-handle { display: flex; align-items: center; gap: 10px; width: 100%; min-height: calc(var(--peek) - 2px); border: 0; border-radius: 16px 16px 0 0; background: transparent; text-align: left; padding: 6px 12px; }
    #sheet-handle .grip { flex: 0 0 36px; height: 5px; border-radius: 3px; background: var(--dim); }
    #sheet-peek { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
    #side.open #sheet-peek { color: var(--text); }
    #side { grid-template-rows: auto minmax(0, 1fr); }
    #sheet-handle { grid-column: 1 / -1; }
